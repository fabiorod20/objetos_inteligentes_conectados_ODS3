<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1080" viewBox="0 0 760 1080" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="760" height="1080" fill="#ffffff"/>
  <g stroke="#333" stroke-width="1.6" fill="none" marker-end="url(#seta)">
    <!-- tronco central -->
    <line x1="300" y1="62" x2="300" y2="88"/>
    <line x1="300" y1="140" x2="300" y2="161"/>
    <line x1="300" y1="258" x2="300" y2="283"/>
    <line x1="300" y1="325" x2="300" y2="350"/>
    <line x1="300" y1="448" x2="300" y2="473"/>
    <line x1="300" y1="525" x2="300" y2="550"/>
    <line x1="300" y1="648" x2="300" y2="670"/>
    <line x1="300" y1="768" x2="300" y2="793"/>
    <line x1="300" y1="845" x2="300" y2="898"/>
    <line x1="300" y1="950" x2="300" y2="983"/>
    <!-- decisões para a direita -->
    <line x1="435" y1="600" x2="508" y2="600"/>
    <line x1="435" y1="720" x2="508" y2="720"/>
    <line x1="435" y1="400" x2="508" y2="400"/>
    <!-- NORMAL e EXCESSO descem até "Publica" -->
    <polyline points="710,600 740,600 740,870 302,870"/>
    <!-- cancelamento volta ao topo -->
    <polyline points="610,380 610,151 302,151"/>
    <!-- volta do fim do ciclo -->
    <polyline points="170,1010 40,1010 40,151 298,151"/>
  </g>
  <g stroke="#333" stroke-width="1.6" fill="none">
    <!-- EXCESSO junta na linha da direita; Sensor 1 "não" junta no retorno -->
    <polyline points="610,745 610,870"/>
    <polyline points="165,210 40,210"/>
  </g>

  <!-- formas -->
  <g stroke="#333" stroke-width="1.6">
    <ellipse cx="300" cy="40" rx="80" ry="22" fill="#e8f5e9"/>
    <rect x="160" y="90" width="280" height="50" rx="6" fill="#e3f2fd"/>
    <polygon points="300,162 435,210 300,258 165,210" fill="#fff8e1"/>
    <rect x="180" y="285" width="240" height="40" rx="6" fill="#e3f2fd"/>
    <polygon points="300,352 435,400 300,448 165,400" fill="#fff8e1"/>
    <rect x="510" y="380" width="200" height="40" rx="6" fill="#eeeeee"/>
    <rect x="150" y="475" width="300" height="50" rx="6" fill="#e3f2fd"/>
    <polygon points="300,552 435,600 300,648 165,600" fill="#fff8e1"/>
    <rect x="510" y="575" width="200" height="50" rx="6" fill="#c8e6c9"/>
    <polygon points="300,672 435,720 300,768 165,720" fill="#fff8e1"/>
    <rect x="510" y="695" width="200" height="50" rx="6" fill="#ffe0b2"/>
    <rect x="150" y="795" width="300" height="50" rx="6" fill="#ffcdd2"/>
    <rect x="150" y="900" width="300" height="50" rx="6" fill="#e3f2fd"/>
    <rect x="170" y="985" width="260" height="50" rx="6" fill="#ede7f6"/>
  </g>

  <!-- textos -->
  <g fill="#111" text-anchor="middle">
    <text x="300" y="45" font-weight="bold">Início</text>
    <text x="300" y="111">Configura pinos e conecta</text>
    <text x="300" y="129">ao Wi-Fi e ao broker MQTT</text>
    <text x="300" y="206">Sensor 1</text>
    <text x="300" y="223">acionado?</text>
    <text x="300" y="310">Registra t1</text>
    <text x="300" y="396">Sensor 2 acionado</text>
    <text x="300" y="413">em até 30 s?</text>
    <text x="610" y="405">Cancela a medição</text>
    <text x="300" y="496">Registra t2 e calcula</text>
    <text x="300" y="514">v = d / (t2 − t1) × 3,6 (km/h)</text>
    <text x="300" y="596">v ≤ 60 km/h?</text>
    <text x="300" y="613">(limite)</text>
    <text x="610" y="596">LED verde</text>
    <text x="610" y="614">status NORMAL</text>
    <text x="300" y="716">v ≤ 78 km/h?</text>
    <text x="300" y="733">(limite + 30%)</text>
    <text x="610" y="716">LED vermelho</text>
    <text x="610" y="734">status EXCESSO</text>
    <text x="300" y="816">LED vermelho + buzzer</text>
    <text x="300" y="834">status CRÍTICO (também no tópico ALERTA)</text>
    <text x="300" y="921">Publica JSON no tópico</text>
    <text x="300" y="939">MACK10433738/DADOS</text>
    <text x="300" y="1006">Node-RED (AWS) exibe no</text>
    <text x="300" y="1024">dashboard e registra alertas</text>
  </g>

  <!-- rótulos sim/não -->
  <g fill="#555" font-size="12" font-style="italic">
    <text x="306" y="275">sim</text>
    <text x="120" y="204">não</text>
    <text x="306" y="465">sim</text>
    <text x="445" y="393">não</text>
    <text x="445" y="593">sim</text>
    <text x="306" y="663">não</text>
    <text x="445" y="713">sim</text>
    <text x="306" y="785">não</text>
  </g>
</svg>
